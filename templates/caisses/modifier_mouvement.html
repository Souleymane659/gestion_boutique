{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Modifier le Mouvement #{{ mouvement.id_mouvement }}</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Caisse: <strong>{{ caisse.nom_caisse }}</strong> | Solde actuel: <strong>{{ '{:,.0f}'.format(caisse.solde) }} FCFA</strong></p>
        
        <form action="{{ url_for('modifier_mouvement_caisse', id_caisse=caisse.id_caisse, id_mouvement=mouvement.id_mouvement) }}" method="POST">
            
            <div class="form-group">
                <label for="type_mouvement">Type de Mouvement</label>
                <select name="type_mouvement" id="type_mouvement" required>
                    <option value="">Sélectionner un type</option>
                    <option value="ENTREE" {% if mouvement.type_mouvement == 'ENTREE' %}selected{% endif %}>ENTRÉE</option>
                    <option value="SORTIE" {% if mouvement.type_mouvement == 'SORTIE' %}selected{% endif %}>SORTIE</option>
                    <option value="TRANSFERT" {% if mouvement.type_mouvement == 'TRANSFERT' %}selected{% endif %}>TRANSFERT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="montant">Montant (FCFA)</label>
                <input type="number" step="0.01" name="montant" id="montant" value="{{ mouvement.montant }}" required>
            </div>

            <div class="form-group">
                <label for="motif">Motif</label>
                <input type="text" name="motif" id="motif" value="{{ mouvement.motif or '' }}" placeholder="Ex: Vente, Dépense, Transfert...">
            </div>

            <button type="submit" class="btn-submit">Mettre à jour le Mouvement</button>
            <a href="{{ url_for('mouvements_caisse', id_caisse=caisse.id_caisse) }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
