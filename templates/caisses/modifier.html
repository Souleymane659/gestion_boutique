{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Modifier la Caisse #{{ caisse.id_caisse }}</h2>
        <form action="{{ url_for('modifier_caisse', id=caisse.id_caisse) }}" method="POST">
            
            <div class="form-group">
                <label for="nom_caisse">Nom de la Caisse</label>
                <input type="text" name="nom_caisse" id="nom_caisse" value="{{ caisse.nom_caisse }}" required>
            </div>

            <div class="form-group">
                <label for="type_caisse">Type de Caisse</label>
                <select name="type_caisse" id="type_caisse" required>
                    <option value="">Sélectionner un type</option>
                    <option value="CASH" {% if caisse.type_caisse == 'CASH' %}selected{% endif %}>CASH</option>
                    <option value="ORANGE_MONEY" {% if caisse.type_caisse == 'ORANGE_MONEY' %}selected{% endif %}>ORANGE MONEY</option>
                    <option value="MOBICASH" {% if caisse.type_caisse == 'MOBICASH' %}selected{% endif %}>MOBICASH</option>
                    <option value="WAVE" {% if caisse.type_caisse == 'WAVE' %}selected{% endif %}>WAVE</option>
                    <option value="CARTE_BANCAIRE" {% if caisse.type_caisse == 'CARTE_BANCAIRE' %}selected{% endif %}>CARTE BANCAIRE</option>
                    <option value="BANQUE" {% if caisse.type_caisse == 'BANQUE' %}selected{% endif %}>BANQUE</option>
                </select>
            </div>

            <div class="form-group">
                <label for="solde">Solde (FCFA)</label>
                <input type="number" step="0.01" name="solde" id="solde" value="{{ caisse.solde }}">
            </div>

            <button type="submit" class="btn-submit">Mettre à jour la Caisse</button>
            <a href="{{ url_for('index_caisses') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
