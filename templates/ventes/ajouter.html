{% extends 'layout.html' %}

{% block content %}
<div class="card">
    <h2>Effectuer une Nouvelle Vente</h2>
    <form action="{{ url_for('ajouter_vente') }}" method="POST" id="vente-form">
        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="id_client">Client</label>
                <select name="id_client" id="id_client" required style="width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); padding: 0.8rem 1rem; border-radius: 12px; color: white;">
                    <option value="">Sélectionner un client</option>
                    {% for client in clients %}
                    <option value="{{ client.id_client }}">{{ client.nom }} {{ client.prenom }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>


        <div id="produits-container">
            <h3 style="margin: 2rem 0 1rem; font-size: 1.1rem; color: var(--text-muted);">Produits</h3>
            <div class="produit-ligne" style="display: grid; grid-template-columns: 3fr 1fr 1.5fr 0.5fr; gap: 1rem; margin-bottom: 1rem; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Produit</label>
                    <select name="produits[]" class="produit-select" required style="width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); padding: 0.8rem 1rem; border-radius: 12px; color: white;">
                        <option value="">Sélectionner un produit</option>
                        {% for produit in produits %}
                        <option value="{{ produit.id_produit }}" data-prix="{{ produit.prix_vente }}">
                            {{ produit.nom_produit }} (Stock: {{ produit.quantite_stock }}) - {{ "{:,.0f}".format(produit.prix_vente) }} FCFA
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Quantité</label>
                    <input type="number" name="quantites[]" class="quantite-input" min="1" value="1" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Sous-total</label>
                    <input type="text" class="sous-total-display" readonly value="0 FCFA" style="background: transparent; border: none; font-weight: 600; color: var(--success);">
                </div>
                <div></div>
            </div>
        </div>

        <button type="button" id="add-ligne" class="btn-icon" style="margin-bottom: 2rem; width: auto; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Ajouter un produit
        </button>

        <div style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 1.25rem; font-weight: 700;">
                Total: <span id="total-general" style="color: var(--success);">0</span> FCFA
            </div>
            <button type="submit" class="btn-submit" style="width: auto; margin-top: 0;">Valider la Vente</button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('produits-container');
    const addBtn = document.getElementById('add-ligne');
    const totalDisplay = document.getElementById('total-general');

    function updateTotals() {
        let total = 0;
        document.querySelectorAll('.produit-ligne').forEach(ligne => {
            const select = ligne.querySelector('.produit-select');
            const quantite = ligne.querySelector('.quantite-input').value;
            const prix = select.options[select.selectedIndex]?.dataset.prix || 0;
            const st = quantite * prix;
            ligne.querySelector('.sous-total-display').value = new Intl.NumberFormat().format(st) + ' FCFA';
            total += st;
        });
        totalDisplay.textContent = new Intl.NumberFormat().format(total);
    }

    addBtn.addEventListener('click', () => {
        const firstLigne = document.querySelector('.produit-ligne');
        const newLigne = firstLigne.cloneNode(true);
        newLigne.querySelector('.quantite-input').value = 1;
        newLigne.querySelector('.produit-select').selectedIndex = 0;
        newLigne.querySelector('.sous-total-display').value = '0 FCFA';
        
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn-icon btn-delete';
        deleteBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        deleteBtn.onclick = () => { newLigne.remove(); updateTotals(); };
        
        newLigne.lastElementChild.appendChild(deleteBtn);
        container.appendChild(newLigne);
        
        addEvents(newLigne);
    });

    function addEvents(ligne) {
        ligne.querySelector('.produit-select').onchange = updateTotals;
        ligne.querySelector('.quantite-input').oninput = updateTotals;
    }

    addEvents(document.querySelector('.produit-ligne'));
});
</script>
{% endblock %}
