{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
    <div class="card">
        <h2>Nouvel Achat</h2>
        <form action="{{ url_for('ajouter_achat') }}" method="POST" id="achatForm">
            
            <div class="form-group">
                <label for="id_fournisseur">Fournisseur (optionnel)</label>
                <select name="id_fournisseur" id="id_fournisseur">
                    <option value="">Sélectionner un fournisseur</option>
                    {% for fournisseur in fournisseurs %}
                    <option value="{{ fournisseur.id_fournisseur }}">{{ fournisseur.nom_fournisseur }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Lignes d'achat</label>
                <div id="lignesContainer">
                    <div class="ligne-achat" style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; margin-bottom: 1rem; align-items: end;">
                        <div>
                            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Produit</label>
                            <select name="id_produit[]" class="produit-select" required>
                                <option value="">Sélectionner</option>
                                {% for produit in produits %}
                                <option value="{{ produit.id_produit }}" data-prix="{{ produit.prix_achat }}">{{ produit.nom_produit }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Quantité</label>
                            <input type="number" name="quantite[]" class="quantite-input" min="1" value="1" required>
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Prix Achat</label>
                            <input type="number" name="prix_achat[]" class="prix-input" min="0" step="0.01" required>
                        </div>
                        <button type="button" class="btn-icon btn-delete" onclick="removeLigne(this)" title="Supprimer la ligne">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <button type="button" class="btn-add" style="margin-top: 1rem; padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="addLigne()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.3rem; vertical-align: middle;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Ajouter une ligne
                </button>
            </div>

            <div style="margin-top: 2rem; padding: 1rem; background: var(--input-bg); border-radius: 12px; text-align: right;">
                <strong>Total: </strong><span id="totalMontant">0,00</span> FCFA
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 1.5rem;">Enregistrer l'Achat</button>
            <a href="{{ url_for('index_achats') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>

<style>
    select {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        padding: 0.8rem 1rem;
        border-radius: 12px;
        color: var(--text-main);
        font-family: inherit;
        transition: all 0.3s;
    }
    
    select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
</style>

<script>
let ligneCount = 1;

function addLigne() {
    const container = document.getElementById('lignesContainer');
    const nouvelleLigne = document.createElement('div');
    nouvelleLigne.className = 'ligne-achat';
    nouvelleLigne.style.cssText = 'display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; margin-bottom: 1rem; align-items: end;';
    nouvelleLigne.innerHTML = `
        <div>
            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Produit</label>
            <select name="id_produit[]" class="produit-select" required onchange="updatePrix(this)">
                <option value="">Sélectionner</option>
                {% for produit in produits %}
                <option value="{{ produit.id_produit }}" data-prix="{{ produit.prix_achat }}">{{ produit.nom_produit }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Quantité</label>
            <input type="number" name="quantite[]" class="quantite-input" min="1" value="1" required onchange="calculerTotal()">
        </div>
        <div>
            <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Prix Achat</label>
            <input type="number" name="prix_achat[]" class="prix-input" min="0" step="0.01" required onchange="calculerTotal()">
        </div>
        <button type="button" class="btn-icon btn-delete" onclick="removeLigne(this)" title="Supprimer la ligne">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    `;
    container.appendChild(nouvelleLigne);
    ligneCount++;
}

function removeLigne(button) {
    const lignes = document.querySelectorAll('.ligne-achat');
    if (lignes.length > 1) {
        button.closest('.ligne-achat').remove();
        calculerTotal();
    }
}

function updatePrix(select) {
    const prix = select.options[select.selectedIndex].dataset.prix;
    const prixInput = select.closest('.ligne-achat').querySelector('.prix-input');
    if (prix) {
        prixInput.value = prix;
    }
    calculerTotal();
}

function calculerTotal() {
    const quantites = document.querySelectorAll('.quantite-input');
    const prix = document.querySelectorAll('.prix-input');
    let total = 0;
    
    quantites.forEach((q, i) => {
        const quantite = parseFloat(q.value) || 0;
        const prixUnitaire = parseFloat(prix[i].value) || 0;
        total += quantite * prixUnitaire;
    });
    
    document.getElementById('totalMontant').textContent = total.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

// Initialiser le prix du premier produit
document.addEventListener('DOMContentLoaded', function() {
    const firstSelect = document.querySelector('.produit-select');
    if (firstSelect) {
        firstSelect.addEventListener('change', function() {
            updatePrix(this);
        });
    }
});
</script>
{% endblock %}
