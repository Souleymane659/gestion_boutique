{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <div class="card">
        <h2>Ajouter un Compte</h2>
        <form action="{{ url_for('ajouter_compte') }}" method="POST">
            
            <div class="form-group">
                <label for="numero_compte">Numéro de Compte</label>
                <input type="text" name="numero_compte" id="numero_compte" required placeholder="Ex: 101, 201, 401...">
            </div>

            <div class="form-group">
                <label for="intitule">Intitulé</label>
                <input type="text" name="intitule" id="intitule" required placeholder="Ex: Capital, Clients, Ventes...">
            </div>

            <div class="form-group">
                <label for="type_compte">Type de Compte</label>
                <select name="type_compte" id="type_compte" required>
                    <option value="">Sélectionner le type</option>
                    <option value="ACTIF">ACTIF</option>
                    <option value="PASSIF">PASSIF</option>
                    <option value="CHARGE">CHARGE</option>
                    <option value="PRODUIT">PRODUIT</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 1.5rem;">Ajouter le Compte</button>
            <a href="{{ url_for('index_plan_comptable') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
