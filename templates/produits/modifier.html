{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Modifier le Produit #{{ produit.id_produit }}</h2>
        <form action="{{ url_for('modifier', id=produit.id_produit) }}" method="POST">
            
            <div class="form-group">
                <label for="nom_produit">Nom du Produit</label>
                <input type="text" name="nom_produit" id="nom_produit" value="{{ produit.nom_produit }}" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="prix_achat">Prix d'Achat (FCFA)</label>
                    <input type="number" step="0.01" name="prix_achat" id="prix_achat" value="{{ produit.prix_achat }}" required>
                </div>
                <div class="form-group">
                    <label for="prix_vente">Prix de Vente (FCFA)</label>
                    <input type="number" step="0.01" name="prix_vente" id="prix_vente" value="{{ produit.prix_vente }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="quantite_stock">Quantité en Stock</label>
                <input type="number" name="quantite_stock" id="quantite_stock" value="{{ produit.quantite_stock }}" required>
            </div>

            <button type="submit" class="btn-submit">Mettre à jour le Produit</button>
            <a href="{{ url_for('index') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
