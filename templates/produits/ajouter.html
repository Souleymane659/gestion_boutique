{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Ajouter un Nouveau Produit</h2>
        <form action="{{ url_for('ajouter') }}" method="POST">
            <div class="form-group">
                <label for="id_produit">ID du Produit (Manuel)</label>
                <input type="number" name="id_produit" id="id_produit" placeholder="Ex: 101" required>
            </div>
            
            <div class="form-group">
                <label for="nom_produit">Nom du Produit</label>
                <input type="text" name="nom_produit" id="nom_produit" placeholder="Ex: Sac à main" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="prix_achat">Prix d'Achat (FCFA)</label>
                    <input type="number" step="0.01" name="prix_achat" id="prix_achat" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="prix_vente">Prix de Vente (FCFA)</label>
                    <input type="number" step="0.01" name="prix_vente" id="prix_vente" placeholder="0.00" required>
                </div>
            </div>

            <div class="form-group">
                <label for="quantite_stock">Quantité en Stock</label>
                <input type="number" name="quantite_stock" id="quantite_stock" placeholder="0" required>
            </div>

            <button type="submit" class="btn-submit">Enregistrer le Produit</button>
            <a href="{{ url_for('index') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
