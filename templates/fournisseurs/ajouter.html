{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Ajouter un Nouveau Fournisseur</h2>
        <form action="{{ url_for('ajouter_fournisseur') }}" method="POST">
            <div class="form-group">
                <label for="id_fournisseur">ID Fournisseur (Manuel)</label>
                <input type="number" name="id_fournisseur" id="id_fournisseur" placeholder="Ex: 501" required>
            </div>
            
            <div class="form-group">
                <label for="nom_fournisseur">Nom du Fournisseur</label>
                <input type="text" name="nom_fournisseur" id="nom_fournisseur" placeholder="Ex: SENELEC" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="text" name="telephone" id="telephone" placeholder="Ex: +221 ...">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="contact@fournisseur.com">
            </div>

            <div class="form-group">
                <label for="adresse">Adresse</label>
                <textarea name="adresse" id="adresse" rows="3" placeholder="Adresse du fournisseur"></textarea>
            </div>

            <button type="submit" class="btn-submit">Enregistrer le Fournisseur</button>
            <a href="{{ url_for('index_fournisseurs') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
