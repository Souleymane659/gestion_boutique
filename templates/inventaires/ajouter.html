{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Créer un Nouvel Inventaire</h2>
        <form action="{{ url_for('ajouter_inventaire') }}" method="POST">
            
            <div class="form-group">
                <label for="reference">Référence</label>
                <input type="text" name="reference" id="reference" placeholder="Ex: INV-2024-01" required>
            </div>

            <div class="form-group">
                <label for="titre">Titre</label>
                <input type="text" name="titre" id="titre" placeholder="Ex: Inventaire Janvier 2024" required>
            </div>

            <div class="form-group">
                <label for="date_inventaire">Date de l'inventaire</label>
                <input type="date" name="date_inventaire" id="date_inventaire" required>
            </div>

            <button type="submit" class="btn-submit">Créer l'Inventaire</button>
            <a href="{{ url_for('index_inventaires') }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
