{% extends 'layout.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Modifier l'Inventaire</h2>
        <form action="{{ url_for('modifier_inventaire', id=inventaire.id_inventaires) }}" method="POST">
            
            <div class="form-group">
                <label for="reference">Référence</label>
                <input type="text" name="reference" id="reference" value="{{ inventaire.reference }}" required>
            </div>

            <div class="form-group">
                <label for="titre">Titre</label>
                <input type="text" name="titre" id="titre" value="{{ inventaire.titre }}" required>
            </div>

            <div class="form-group">
                <label for="date_inventaire">Date de l'inventaire</label>
                <input type="date" name="date_inventaire" id="date_inventaire" value="{{ inventaire.date_inventaire.strftime('%Y-%m-%d') }}" required>
            </div>

            <button type="submit" class="btn-submit">Mettre à jour l'Inventaire</button>
            <a href="{{ url_for('details_inventaire', id=inventaire.id_inventaires) }}" style="display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
