{% extends 'layout.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 2rem;">Modifier l'Utilisateur</h2>

    <form action="{{ url_for('modifier_utilisateur', id=utilisateur.id) }}" method="POST">
        <div class="form-group">
            <label for="nom">Nom Complet</label>
            <input type="text" name="nom" id="nom" value="{{ utilisateur.nom }}" required>
        </div>
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" name="username" id="username" value="{{ utilisateur.username }}" required>
        </div>
        <div class="form-group">
            <label for="password">Nouveau mot de passe <span style="font-weight: 300; font-size: 0.8rem; color: var(--text-muted);">(Laissez vide pour conserver l'actuel)</span></label>
            <input type="password" name="password" id="password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="role">Rôle</label>
            <select name="role" id="role" required>
                <option value="Caisier" {% if utilisateur.role == 'Caisier' %}selected{% endif %}>Caisier</option>
                <option value="Comptable" {% if utilisateur.role == 'Comptable' %}selected{% endif %}>Comptable</option>
            </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-submit">Mettre à jour</button>
            <a href="{{ url_for('index_utilisateurs') }}" class="btn-submit" style="background: var(--secondary); text-align: center; text-decoration: none;">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
